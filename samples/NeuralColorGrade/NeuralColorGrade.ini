; NeuralColorGrade -- reference SkyrimUpscaler neural rendering module.
;
; Place this file next to NeuralColorGrade.dll in
;   Data/SKSE/Plugins/SkyrimUpscaler/Neural/
; Values are read once, when the module initialises on the first rendered frame,
; so restart the game after editing.
;
; Leaving every value at its default makes the grade the identity, and the
; module then skips its pass entirely -- change something to see an effect.

[Grade]

; Linear exposure multiplier applied before everything else. 1.0 = unchanged.
Exposure=1.0

; Contrast around mid grey (0.18). 1.0 = unchanged, >1 harder, <1 flatter.
Contrast=1.0

; 1.0 = unchanged, 0.0 = greyscale, >1 = oversaturated.
Saturation=1.0

; -1.0 (cool/blue) .. 0.0 (neutral) .. +1.0 (warm/red).
Temperature=0.0
